CONFIG_ZMK_KEYBOARD_NAME="KeyballBLE"

CONFIG_ZMK_MOUSE=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y



CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1000
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=64
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=100000

CONFIG_PMW3610_MOVEMENT_THRESHOLD=5

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n





###############　以下追加したもの
# 全プラットフォームで安定動作
CONFIG_BT_CTLR_PHY_2M=n
#CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# HID最適化（全プラットフォーム有効）
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y


# デバウンス（安定性重視）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Xiao BLE電力管理最適化
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=n

# Xiao BLEのBluetooth最適化
CONFIG_BT_CTLR_CONN_PARAM_REQ=y

# プロファイル管理最適化
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=2
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# 使用していないプロファイルの負荷軽減
CONFIG_BT_SETTINGS_CCC_LAZY_LOADING=y
CONFIG_BT_SETTINGS_USE_PRINTK=n

# Windows互換性最優先
CONFIG_BT_GATT_AUTO_SEC_REQ=n

# センサー読み取り最適化
CONFIG_SENSOR_LOG_LEVEL_OFF=y

# Left側（Peripheral）からの不要なデータ削減
# CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=n


