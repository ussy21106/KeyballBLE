CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_STUDIO=n

# ----------------------------------------
# BLE／HID／電力管理：右側と完全同期設定
# 左側 .conf にそのまま貼り付けてください
# ----------------------------------------
# 2M PHY無効：安定動作重視
CONFIG_BT_CTLR_PHY_2M=n
#CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# 最低接続間隔：7.5ms（6×1.25ms）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# 最大接続間隔：15ms（12×1.25ms）
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# レイテンシ0：スキップ無しで追従安定
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# 監視タイムアウト：400（10ms単位→約4秒）
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# NKRO無効（安定性重視）
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
# HKRO有効（一般的で安定）
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# デバウンス安定化（押下）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
# デバウンス安定化（離す）
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# BLE送信パワー強化：安定性向上
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# デバイス電源管理ON
CONFIG_PM_DEVICE=y
# ランタイム省電力OFF：遅延防止
CONFIG_PM_DEVICE_RUNTIME=n

# Connection Parameter Request 有効化
# Windows側への接続間隔要求が安定する
CONFIG_BT_CTLR_CONN_PARAM_REQ=y
