# KeyballBLE_dongle.conf - 修正版

CONFIG_ZMK_KEYBOARD_NAME="Keyball_Dongle"

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y
# CapsLEDレポート(ドッグ導入後に切替時WindosがCapsLockがONになってしまう改善対応)
CONFIG_ZMK_HID_INDICATORS=y

# Split keyboard設定（基本）
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# USB/BLE設定（基本）
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n


# ★Bluetooth設定（追加・修正）
CONFIG_BT=y 
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# エンコーダーサポート（Split Encoder受信処理用）
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# 一時的にコメントアウト（動作確認後に有効化）
# CONFIG_ZMK_PHYSICAL_LAYOUTS=y

# デバッグ用（必要に応じて）
CONFIG_LOG=y
#CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_DEFAULT_LEVEL=2
##　より上位のログを出したいときは、個々の値を変える
#CONFIG_LOG_OVERRIDE_LEVEL=2
##　ドングルのみ設定
CONFIG_ZMK_USB_LOGGING=y
# 実行時にレベルを上げられないよう固定
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_BACKEND_RTT=n
#ログの出力MAXれべる設定(2:WRN),ログ出力したいときは、ここを数値を上げる
CONFIG_LOG_MAX_LEVEL=2


# デバッグ強めたい時はあとから段階的に
CONFIG_ASSERT=y
#CONFIG_RESET_ON_FATAL_ERROR=y

# 確実にサポートされている設定のみ
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# USB使用時はZMKスリープを無効化
CONFIG_ZMK_SLEEP=n

# 電池残量報告を有効化
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# Split接続での電池残量取得・転送を有効化
###CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHINGは、Yにするとスリープ問題が発生する可能性あり
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

###  Zephyr/ZMK 内の「システムワークキュー」のスタック領域を増やす設定。
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
