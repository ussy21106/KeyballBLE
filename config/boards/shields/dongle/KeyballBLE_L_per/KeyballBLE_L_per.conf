## ===== 5. keyballBLE_dongle/KeyballBLE_L_peripheral.conf (新規作成) =====
## 左側Peripheral用設定 - ドングル接続対応
CONFIG_ZMK_KEYBOARD_NAME="KeyballBLE_L_Per"

# ★重要：Peripheralとして動作
CONFIG_ZMK_SPLIT=y

# ZMK Studio無効化（ドングル構成では不要）
CONFIG_ZMK_STUDIO=n

# 基本設定
CONFIG_ZMK_BLE=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BATTERY_REPORTING=y

# エンコーダー設定
#CONFIG_EC11=y
#CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ★重要：Peripheral用接続設定（ドングル接続最適化）
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ★重要：接続管理設定（Central機能削除）
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y 削除
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y 削除

# HID設定
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# デバウンス設定(3,5 > 10に変更)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# 電力管理最適化
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# ランタイムPMを無効化（QDECが勝手にsleepしないように）
CONFIG_PM_DEVICE=n
# 念のため省電力系の自動Suspenderも切っておく（任意）
# ← 省電力を残したいなら y のままでもOK
CONFIG_PM=y
####CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_BT_CTLR_CONN_PARAM_REQ=y

# 設定最適化
CONFIG_BT_SETTINGS_CCC_LAZY_LOADING=y
CONFIG_BT_SETTINGS_USE_PRINTK=n
CONFIG_BT_GATT_AUTO_SEC_REQ=n

CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

CONFIG_BT_DEVICE_NAME_MAX=25

# 右・左 両方（再接続を安定化）
CONFIG_BT_PRIVACY=n                     # RPAを使わず再発見を容易に


#ログ関連
CONFIG_LOG=n
# ★ ZMKモジュールをWRN固定（最強）
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_LOG_DEFAULT_LEVEL=1
##　より上位のログを出したいときは、個々の値を変える
CONFIG_LOG_OVERRIDE_LEVEL=1
